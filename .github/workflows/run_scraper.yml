name: Metal Scraper

on:
  schedule:
    - cron: '15 4 * * *'   # 00:20 Colombia
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          echo "Installing Python dependencies..."
          pip install --upgrade pip
          pip install pandas openpyxl xlsxwriter playwright requests beautifulsoup4

      - name: Install Playwright browser
        run: |
          echo "Installing Playwright browser..."
          playwright install --with-deps chromium

      - name: Verify Playwright installation
        run: |
          echo "✅ Playwright installed successfully"
          playwright --version

      - name: Run scraper with retry
        env:
          METAL_USER: ${{ secrets.METAL_USER }}
          METAL_PASS: ${{ secrets.METAL_PASS }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: |

          echo "Starting scraper..."

          ATTEMPT=1
          MAX_ATTEMPTS=3

          until [ $ATTEMPT -gt $MAX_ATTEMPTS ]
          do

            echo "Attempt $ATTEMPT of $MAX_ATTEMPTS"

            python scraper.py && break

            echo "Scraper failed..."

            ATTEMPT=$((ATTEMPT+1))

            if [ $ATTEMPT -le $MAX_ATTEMPTS ]; then
              echo "Retrying in 30 seconds..."
              sleep 30
            fi

          done

          if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
            echo "Scraper failed after $MAX_ATTEMPTS attempts"
            exit 1
          fi
      
      - name: Upload report artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-diario
          path: Reporte_Diario.xlsx
          retention-days: 30

      - name: Upload debug files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: |
            *.png
            *.html
            *.log
          retention-days: 7

      - name: Success log
        run: echo "Scraper completed successfully"
